name: Nix build & cache

# Builds our own tool derivations (`.#ciTargets`), pushes them to the `ctftools`
# Cachix cache, and (on non-PR events) builds a per-tool Docker image that
# installs the tool with Nix.
#
# The nixpkgs passthroughs (nix/passthrough.nix) are not rebuilt here —
# cache.nixos.org already serves them — but they are not unchecked either: the
# `tools` job forces every one of their drvPaths, which is what turns a nixpkgs
# rename arriving via a flake.lock bump into a red build instead of a silently
# broken documented tool. `.#default`, the env `nix profile install .` resolves
# to, gets its own (real) build for the same reason.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# One run per ref. This workflow fans out to ~213 jobs (a build per tool, plus
# the cross2 and crosstool-ng toolchain matrices), so without this a burst of
# pushes leaves several full runs competing for the same runner pool and
# everything sits queued for hours. Superseded runs are cancelled: their results
# describe a tree that is no longer the tip, and anything they had already built
# is in Cachix, so the replacement run substitutes it instead of rebuilding.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Enumerate CI targets
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
      toolchains: ${{ steps.list.outputs.toolchains }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - id: list
        name: Read .#ciTargets and .#ciToolchainTargets
        run: |
          {
            echo "tools=$(nix eval --json .#ciTargets)"
            echo "toolchains=$(nix eval --json .#ciToolchainTargets)"
          } >> "$GITHUB_OUTPUT"
      - name: nixpkgs passthroughs still resolve
        # Seconds of evaluation, no build: cache.nixos.org already builds these,
        # but nothing else here even *mentions* them, so a nixpkgs rename or
        # removal would otherwise break `.#gdb`/`.#ropper`/... unnoticed. The
        # failure is an eval error naming the attribute and its line in
        # nix/passthrough.nix.
        run: nix eval --raw .#ciPassthroughCheck.x86_64-linux

  listcheck:
    name: README tool table matches the flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: README <!--tool--> rows == .#readmeTargets
        # The pre-nix `listcheck` job, restored. `.#readmeTargets` (every
        # hand-written derivation plus every passthrough) is a flake output
        # rather than a regex over the package list, so adding an output that
        # isn't a tool — cross2-*, crosstool-ng-*, default — can't quietly turn
        # this check into a no-op or a false failure.
        run: |
          diff <(grep -- '<!--tool-->' README.md | tr '[]' ' ' | awk '{print $4}' | LC_ALL=C sort) \
               <(nix eval --raw .#readmeTargets \
                   --apply 'ns: builtins.concatStringsSep "\n" ns' | LC_ALL=C sort)

  default-profile:
    name: build .#default (nix profile install .)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Build .#default
        # The aggregate env `nix profile install .` resolves to, and the one
        # target whose failure mode (a buildEnv collision) only appears when the
        # env itself is built. No cachix push on this job: the env is a per-user
        # symlink tree not worth caching, and its inputs come from
        # cache.nixos.org — including unfree binaries we must not redistribute.
        run: nix build -L .#default

  manage-tools:
    name: manage-tools (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: setup (bootstraps flakes + cache config)
        run: ./bin/manage-tools setup
      - name: list
        run: |
          ./bin/manage-tools list | tee /tmp/tools.txt
          grep -qx pwntools /tmp/tools.txt
          test "$(wc -l < /tmp/tools.txt)" -gt 50
      - name: search
        run: ./bin/manage-tools search stego | grep -qi steg
      - name: install / list -i / uninstall round-trip
        run: |
          # No `|| echo 0` fallback: wc -l already prints 0 for a missing
          # directory, and under the runner's default `bash -eo pipefail` ls's
          # nonzero status propagates through the pipe, so the fallback would
          # fire too and make this the two-line string "0\n0".
          before=$(ls "$HOME/.nix-profile/bin" 2>/dev/null | wc -l)
          ./bin/manage-tools install hash-identifier
          after=$(ls "$HOME/.nix-profile/bin" | wc -l)
          test "$after" -gt "$before"                       # something got installed
          ./bin/manage-tools list -i                        # must not error
          ./bin/manage-tools uninstall hash-identifier
          final=$(ls "$HOME/.nix-profile/bin" 2>/dev/null | wc -l)
          test "$final" -lt "$after"                         # ... and removed

  build:
    name: build ${{ matrix.tool }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: ctftools
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build ${{ matrix.tool }}
        run: nix build -L ".#${{ matrix.tool }}"

  toolchains:
    name: toolchain ${{ matrix.tool }}
    needs: tools
    # Heavy gcc+libc-from-source builds (cross2 + all crosstool-ng samples). Don't
    # re-run the whole fleet on every PR sync — build on push, nightly, and manual.
    if: github.event_name != 'pull_request'
    # Best-effort: many of these are 30-year-old ports or heavy distro toolchains
    # that don't build on a modern host. A failed leg records the fact and caches
    # what did build, without failing the overall run.
    continue-on-error: true
    strategy:
      fail-fast: false
      # Only bites when Cachix has lost these paths and the fleet rebuilds from
      # source; a cached leg is ~2 minutes. At 12 the rebuild case ran 111 legs
      # (~3200 job-minutes) twelve at a time — 4.5 hours during which the other
      # ~28 of the account's 40 concurrent runners sat idle, because `build` and
      # `docker` had long since finished. 24 keeps half the pool free for them
      # and roughly halves the rebuild's wall clock.
      max-parallel: 24
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.toolchains) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: ctftools
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Don't cache the per-sample tarball sets (mk-toolchain.nix's `sources`
          # FOD). They were ~14.5GB of the cache — more than the toolchains they
          # feed — and nothing reads them on the happy path: when a toolchain
          # substitutes, Nix never realizes its inputs at all. They are only
          # wanted during a rebuild, and rebuilding one costs 45s-3min against
          # the 20-220min build it precedes. Crowding the toolchain outputs out
          # of the cache to save that is a bad trade.
          pushFilter: crosstool-ng-sources-
      - name: Build ${{ matrix.tool }} (gcc + libc from source; slow)
        run: nix build -L ".#${{ matrix.tool }}"

  docker:
    name: docker ${{ matrix.tool }}
    needs: [tools, build]
    # Push images only when we have Docker Hub creds (not on fork PRs). Run even
    # if some build legs failed — each image installs its own tool from Cachix,
    # so one tool's failure shouldn't block the rest.
    if: ${{ always() && github.event_name != 'pull_request' && needs.tools.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate Dockerfile (Nix installs the tool)
        run: |
          NAME=$(echo "${{ matrix.tool }}" | tr -cd '0-9A-Za-z._-')
          cat > Dockerfile <<EOF
          FROM nixos/nix:latest
          # Install this ctf-tool into the image's Nix profile, pulling prebuilt
          # binaries from the ctftools Cachix cache (see the flake's nixConfig).
          # Retry to ride out transient DNS/network hiccups in the build runner.
          # --priority 4 lets a tool's binaries win over the base image's
          # (e.g. codext ships base32/base64 that collide with coreutils).
          RUN for i in 1 2 3 4 5; do \\
                nix --extra-experimental-features 'nix-command flakes' \\
                    profile install --priority 4 --accept-flake-config \\
                    "github:${{ github.repository }}/${{ github.sha }}#${NAME}" && exit 0; \\
                echo "install attempt \$i failed; retrying in 10s"; sleep 10; \\
              done; exit 1
          ENV PATH=/root/.nix-profile/bin:\$PATH
          EOF
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          cat Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ctftools/${{ env.NAME }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ctftools/${{ env.NAME }}:latest
      - name: Tag the dated build (this is what the README badges show)
        # README's `img.shields.io/docker/v/ctftools/<tool>?label=built` badges
        # resolve to the most recently *pushed* tag, so with only `:latest` they
        # all read "built: latest" instead of a date. Pushed as a second step,
        # after `latest`: listing both in `tags:` above stamps them in the same
        # push with no defined tie-break, and the badge could pick either.
        run: |
          docker buildx imagetools create \
            -t "ctftools/${{ env.NAME }}:$(date +%Y-%m-%d)" \
            "ctftools/${{ env.NAME }}:latest"
