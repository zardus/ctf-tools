name: Nix build & cache

# The Nix-native replacement for the old per-tool Docker image pipeline.
# Every tool is an output of the flake; we build each one and push the
# resulting store paths to the `ctftools` Cachix cache, so users download
# prebuilt binaries instead of compiling locally.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  tools:
    name: Enumerate tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - id: list
        name: List flake tool outputs
        run: |
          {
            echo -n "tools="
            nix eval --json ".#packages.x86_64-linux" \
              --apply 'ns: builtins.filter (n: n != "default") (builtins.attrNames ns)'
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.tool }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Pushes every store path built below to the cache (no-op without the token,
      # e.g. on PRs from forks).
      - uses: cachix/cachix-action@v15
        with:
          name: ctftools
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build ${{ matrix.tool }}
        run: nix build -L ".#${{ matrix.tool }}"
